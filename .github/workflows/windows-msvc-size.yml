name: Godot MSVC release size only
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/windows-msvc-size.yml
      - artifacts/windows-msvc-plan/**
  workflow_dispatch:
    inputs:
      upload_reports:
        description: Retain logs and linker maps as a short-lived artifact
        type: boolean
        default: false
      upload_binaries:
        description: Upload EXE and optional PDB files (large; not needed for size report)
        type: boolean
        default: false
      debug_symbols:
        description: Generate release PDBs; report debug-directory overhead separately from default comparison
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  size:
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONIOENCODING: utf8
      SCONS_CACHE_MSVC_CONFIG: 'true'
    steps:
      - name: Checkout experiment scripts
        uses: actions/checkout@v6.0.2
        with:
          path: experiment
          persist-credentials: false
      - name: Checkout pinned upstream Godot
        uses: actions/checkout@v6.0.2
        with:
          repository: godotengine/godot
          ref: ed1daf0bf001b61586d9930840f2f1394092c079
          path: godot
          persist-credentials: false
      - uses: actions/setup-python@v6.1.0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install pinned build orchestrator
        run: |
          python -m pip install scons==4.10.1
          if ($LASTEXITCODE -ne 0) { throw 'SCons installation failed' }
      - name: Compile and statically measure (never execute Godot)
        env:
          GENERATE_PDB: ${{ inputs.debug_symbols }}
        run: ./experiment/artifacts/windows-msvc-plan/build.ps1
      - name: Upload small evidence and maps
        if: always() && inputs.upload_reports
        uses: actions/upload-artifact@v4.6.2
        with:
          name: msvc-size-evidence
          path: reports/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload binaries and PDBs only when explicitly selected
        if: success() && inputs.upload_binaries
        uses: actions/upload-artifact@v4.6.2
        with:
          name: msvc-release-binaries
          path: |
            godot/bin/*.exe
            godot/bin/*.pdb
          retention-days: 3
          compression-level: 1
